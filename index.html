<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFA Fresh Eggs Manager</title>
<style>
:root{--bg:#FFF9EC;--cd:#fff;--tx:#1d2a22;--mu:#66756b;--g:#1F5E3B;--on:#fff;--y:#F5A623;--bd:#e8dfc8;--rd:#b3261e;--rb:#fde8e6;--gb:#e5f4e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--cd:#1c2b23;--tx:#f1efe6;--mu:#9fb0a5;--g:#7FC77A;--on:#10281a;--bd:#2c3f34;--rd:#ff8a80;--rb:#3a2220;--gb:#1e3a2a}}
:root[data-theme="dark"]{--bg:#14201a;--cd:#1c2b23;--tx:#f1efe6;--mu:#9fb0a5;--g:#7FC77A;--on:#10281a;--bd:#2c3f34;--rd:#ff8a80;--rb:#3a2220;--gb:#1e3a2a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--g);color:var(--on)}
header b{font:700 18px Georgia,serif;letter-spacing:1px}header small{display:block;opacity:.85;font-size:12px}
main{max-width:640px;margin:0 auto;padding:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px;font-weight:600}h3{font-size:14px;margin:0 0 8px;color:var(--mu);font-weight:500}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
input,select{width:100%;font:inherit;padding:10px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 14px;background:var(--g);color:var(--on);width:100%;cursor:pointer}
button.s{background:none;color:var(--rd);width:auto;padding:2px 8px;font-size:18px}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.k div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}
.k span{font-size:12px;color:var(--mu);display:block}.k b{font-size:19px}
.p{color:var(--g)}.n{color:var(--rd)}
.l{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.l:first-of-type{border-top:0}.l small{color:var(--mu);display:block}
.t{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--rb);color:var(--rd)}
.t.o{background:var(--gb);color:var(--g)}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:11px;font-weight:500;flex:1}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.1}
nav button.a{color:var(--g);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:9}
</style></head><body>
<header>
<svg width="38" height="38" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#FFF6E0"/><circle cx="50" cy="50" r="42" fill="#1F5E3B"/><path d="M50 22C64 22 72 38 72 50C72 63 62 71 50 71C38 71 28 63 28 50C28 38 36 22 50 22Z" fill="#FFF6E0"/><circle cx="50" cy="55" r="9" fill="#F5A623"/><path d="M50 72C42 74 34 71 31 65C39 64 47 66 50 72ZM50 72C58 74 66 71 69 65C61 64 53 66 50 72Z" fill="#7FC77A"/></svg>
<div><b>AFA FRESH EGGS</b><small id="wk"></small></div></header>
<main id="m"></main>
<nav id="nv"></nav><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='PASTE_PROJECT_URL',SB_KEY='PASTE_ANON_KEY',tab='home',SHOPS=['Main Shop','Market Shop'],S={prices:[],col:[],sales:[],pay:[],costs:[]},snap={},TB={prices:'prices',col:'collections',sales:'sales',pay:'payments',costs:'costs'},SB;
async function load(){for(var k in TB){var r=await SB.from(TB[k]).select('*').order('created_at');if(r.error){toast('Could not load '+k);continue}S[k]=r.data.map(function(x){delete x.created_at;return x});snap[k]={};S[k].forEach(function(x){snap[k][x.id]=JSON.stringify(x)})}}
async function save(){for(var k in TB){var old=snap[k]||{},ids={},up=[];S[k].forEach(function(x){ids[x.id]=1;if(old[x.id]!==JSON.stringify(x))up.push(x)});var del=Object.keys(old).filter(function(i){return !ids[i]});
try{if(up.length){var r=await SB.from(TB[k]).upsert(up);if(r.error)throw r.error}if(del.length){var r2=await SB.from(TB[k]).delete().in('id',del);if(r2.error)throw r2.error}snap[k]={};S[k].forEach(function(x){snap[k][x.id]=JSON.stringify(x)})}catch(e){toast('Not saved. Check your internet and try again');return}}}
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var td=function(){return new Date().toISOString().slice(0,10)};
var plus=function(d){return new Date(Date.now()+d*864e5).toISOString().slice(0,10)};
var gh=function(n){return 'GH₵ '+(Math.round(n*100)/100).toLocaleString()};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var sum=function(a,f){return a.reduce(function(t,x){return t+f(x)},0)};
var num=function(id){return parseFloat($(id).value)||0};
function wkStart(){var x=new Date();x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){e.hidden=true},2500)}
function prod(id){return S.prices.find(function(p){return p.id==id})}
function pOpts(){return S.prices.map(function(p){return'<option value="'+p.id+'">'+esc(p.farm)+' · '+esc(p.item)+'</option>'}).join('')}
function shopOpts(){return SHOPS.map(function(s){return'<option>'+s+'</option>'}).join('')}
function noPrices(){return '<div class="c">Add your farms and prices first in the <b>Prices</b> tab.</div>'}
function debts(){var m={};
S.sales.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(s){var o=s.qty*s.price-s.paid;if(o>.005&&s.cust){var c=m[s.cust]=m[s.cust]||{n:s.cust,l:[],p:0};c.l.push({o:o,due:s.due||s.date})}});
S.pay.forEach(function(p){var c=m[p.cust]=m[p.cust]||{n:p.cust,l:[],p:0};c.p+=p.amt});
return Object.values(m).map(function(c){var p=c.p;c.l.forEach(function(x){var t=Math.min(x.o,p);x.o-=t;p-=t});var o=c.l.filter(function(x){return x.o>.005});return{n:c.n,bal:sum(o,function(x){return x.o}),due:o.length?o.map(function(x){return x.due}).sort()[0]:''}}).filter(function(c){return c.bal>.005}).sort(function(a,b){return a.due<b.due?-1:1})}
function stock(){var m={},L={};
S.col.forEach(function(c){var k=c.shop+'|'+c.pid;m[k]=(m[k]||0)+c.qty;L[c.pid]=c.lbl});
S.sales.forEach(function(s){var k=s.shop+'|'+s.pid;m[k]=(m[k]||0)-s.qty;L[s.pid]=s.lbl});
return{m:m,L:L}}
function recent(arr,type,fn){return arr.slice(-5).reverse().map(function(x){return'<div class="l"><div>'+fn(x)+'</div><button class="s" aria-label="Delete" onclick="del(\''+type+'\',\''+x.id+'\')">×</button></div>'}).join('')||'<small style="color:var(--mu)">Nothing yet</small>'}
function del(t,id){if(!confirm('Delete this entry?'))return;S[t]=S[t].filter(function(x){return x.id!=id});save();render()}
var V={
home:function(){var w=wkStart(),sa=S.sales.filter(function(s){return s.date>=w}),rev=sum(sa,function(s){return s.qty*s.price}),cash=sum(sa,function(s){return s.paid})+sum(S.pay.filter(function(p){return p.date>=w}),function(p){return p.amt}),buy=sum(S.col.filter(function(c){return c.date>=w}),function(c){return c.qty*c.buy}),tr=sum(S.costs.filter(function(c){return c.date>=w}),function(c){return c.amt}),pf=cash-buy-tr,d=debts(),owed=sum(d,function(x){return x.bal}),od=d.filter(function(x){return x.due<td()}).length,fo=sum(S.col.filter(function(c){return !c.paid}),function(c){return c.qty*c.buy}),st=stock(),h='';
h+='<div class="k"><div><span>Sales this week</span><b>'+gh(rev)+'</b></div><div><span>Cash received</span><b>'+gh(cash)+'</b></div><div><span>Farm purchases</span><b>'+gh(buy)+'</b></div><div><span>Transport</span><b>'+gh(tr)+'</b></div></div>';
h+='<div class="c"><h3>Cash profit this week</h3><b class="'+(pf<0?'n':'p')+'" style="font-size:26px">'+gh(pf)+'</b><small style="display:block;color:var(--mu)">Cash received − farm purchases − transport</small></div>';
h+='<div class="k"><div><span>Customers owe you</span><b class="'+(od?'n':'')+'">'+gh(owed)+'</b>'+(od?'<span class="n">'+od+' overdue</span>':'')+'</div><div><span>You owe farmers</span><b>'+gh(fo)+'</b></div></div>';
SHOPS.forEach(function(s){var rows=Object.keys(st.m).filter(function(k){return k.split('|')[0]==s}).map(function(k){var q=st.m[k],pid=k.split('|')[1];return'<div class="l"><span>'+esc(st.L[pid])+'</span><b class="'+(q<=0?'n':'')+'">'+q+' crates</b></div>'}).join('');h+='<div class="c"><h2>'+s+' stock</h2>'+(rows||'<small style="color:var(--mu)">No stock yet. Log a collection.</small>')+'</div>'});
return h+'<div class="c"><h3>Data</h3><div class="r"><button onclick="backup()">Download backup</button><button onclick="logout()" style="background:var(--bd);color:var(--tx)">Sign out</button></div></div>'},
collect:function(){if(!S.prices.length)return noPrices();return'<div class="c"><h2>Farm collection</h2><label>Date<input type="date" id="c-d" value="'+td()+'"></label><label>Farm · egg size<select id="c-p" onchange="cp()">'+pOpts()+'</select></label><div class="r"><label>Crates<input id="c-q" type="number" inputmode="decimal" oninput="cp(1)"></label><label>Farm price / crate<input id="c-b" type="number" inputmode="decimal" oninput="cp(1)"></label></div><label>Goes to<select id="c-s">'+shopOpts()+'</select></label><label>Transport cost for this trip (optional)<input id="c-t" type="number" inputmode="decimal"></label><label><input type="checkbox" id="c-pd" style="width:auto;margin-right:8px">Already paid the farmer</label><div id="c-tot" style="margin-bottom:10px;font-weight:600"></div><button onclick="addCol()">Save collection</button></div><div class="c"><h3>Recent collections</h3>'+recent(S.col,'col',function(c){return esc(c.lbl)+' · '+c.qty+' crates<small>'+c.date+' · '+c.shop+' · '+gh(c.qty*c.buy)+(c.paid?' · paid':' · unpaid')+'</small>'})+'</div>'},
sell:function(){if(!S.prices.length)return noPrices();var cl=debts().map(function(d){return'<option value="'+esc(d.n)+'">'}).join('');return'<div class="c"><h2>New sale</h2><datalist id="cl">'+cl+'</datalist><div class="r"><label>Date<input type="date" id="s-d" value="'+td()+'"></label><label>Shop<select id="s-s">'+shopOpts()+'</select></label></div><label>Farm · egg size<select id="s-p" onchange="sp()">'+pOpts()+'</select></label><div class="r"><label>Crates<input id="s-q" type="number" inputmode="decimal" oninput="sp(1)"></label><label>Price / crate<input id="s-pr" type="number" inputmode="decimal" oninput="this.dataset.t=1;sp(1)"></label></div><label>Customer (blank = walk-in)<input id="s-c" list="cl"></label><label>Payment<select id="s-m" onchange="sp(1)"><option value="f">Paid in full</option><option value="p">Part paid</option><option value="c">On credit</option></select></label><div id="s-pt" hidden><label>Amount paid now<input id="s-a" type="number" inputmode="decimal"></label></div><div id="s-du" hidden><label>Must pay back within<select id="s-dd"><option value="7">1 week</option><option value="14">2 weeks</option><option value="21">3 weeks</option><option value="30">1 month</option></select></label></div><div id="s-tot" style="margin-bottom:10px;font-weight:600"></div><button onclick="addSale()">Save sale</button></div><div class="c"><h3>Recent sales</h3>'+recent(S.sales,'sales',function(s){return esc(s.lbl)+' · '+s.qty+' × '+gh(s.price)+'<small>'+s.date+' · '+s.shop+' · '+esc(s.cust||'Walk-in')+(s.paid<s.qty*s.price-.005?' · owes '+gh(s.qty*s.price-s.paid):'')+'</small>'})+'</div>'},
credit:function(){var d=debts(),h='<div class="c"><h2>Who owes you</h2>';h+=d.map(function(x,i){var o=x.due<td();return'<div style="padding:10px 0;border-top:1px solid var(--bd)"><div class="l" style="border:0;padding:0"><div><b>'+esc(x.n)+'</b><small>Due '+x.due+'</small></div><div style="text-align:right"><b>'+gh(x.bal)+'</b><br><span class="t'+(o?'':' o')+'">'+(o?'Overdue':'On time')+'</span></div></div><div class="r" style="margin-top:8px;grid-template-columns:1fr auto"><input id="pa'+i+'" type="number" inputmode="decimal" placeholder="Amount paid" style="margin:0"><button onclick="pay('+i+')" style="width:auto">Record</button></div></div>'}).join('')||'<small style="color:var(--mu)">Nobody owes you. Credit sales appear here.</small>';return h+'</div><div class="c"><h3>Recent payments</h3>'+recent(S.pay,'pay',function(p){return esc(p.cust)+' paid '+gh(p.amt)+'<small>'+p.date+'</small>'})+'</div>'},
costs:function(){var w=wkStart(),tr=sum(S.costs.filter(function(c){return c.date>=w}),function(c){return c.amt}),cr=sum(S.col.filter(function(c){return c.date>=w}),function(c){return c.qty});return'<div class="k"><div><span>Transport this week</span><b>'+gh(tr)+'</b></div><div><span>Per crate collected</span><b>'+(cr?gh(tr/cr):'–')+'</b></div></div><div class="c"><h2>Add transport / expense</h2><div class="r"><label>Date<input type="date" id="x-d" value="'+td()+'"></label><label>Amount<input id="x-a" type="number" inputmode="decimal"></label></div><label>What for<input id="x-n" placeholder="e.g. Fuel to Farm A"></label><button onclick="addCost()">Save expense</button></div><div class="c"><h3>Recent expenses</h3>'+recent(S.costs,'costs',function(c){return esc(c.descr)+' · '+gh(c.amt)+'<small>'+c.date+'</small>'})+'</div>'},
prices:function(){var fl=Array.from(new Set(S.prices.map(function(p){return p.farm}))).map(function(f){return'<option value="'+esc(f)+'">'}).join('');return'<div class="c"><h2>Add farm price</h2><datalist id="fl">'+fl+'</datalist><label>Farm<input id="n-f" list="fl" placeholder="e.g. Farm A"></label><label>Egg size / type<input id="n-i" placeholder="e.g. Large"></label><div class="r"><label>Farm price / crate<input id="n-b" type="number" inputmode="decimal"></label><label>Selling price / crate<input id="n-s" type="number" inputmode="decimal"></label></div><button onclick="addPrice()">Add</button></div><div class="c"><h2>Price list</h2>'+(S.prices.map(function(p){var pf=p.sell-p.buy;return'<div style="padding:10px 0;border-top:1px solid var(--bd)"><div class="l" style="border:0;padding:0"><b>'+esc(p.farm)+' · '+esc(p.item)+'</b><button class="s" aria-label="Delete" onclick="delP(\''+p.id+'\')">×</button></div><div class="pr"><label>Farm price<input type="number" inputmode="decimal" value="'+p.buy+'" onchange="upP(\''+p.id+'\',\'buy\',this.value)"></label><label>Selling price<input type="number" inputmode="decimal" value="'+p.sell+'" onchange="upP(\''+p.id+'\',\'sell\',this.value)"></label></div><small style="color:var(--mu)">Profit '+gh(pf)+' per crate · margin '+(p.sell?Math.round(pf/p.sell*100):0)+'%</small></div>'}).join('')||'<small style="color:var(--mu)">No prices yet</small>')+'</div>'}
};
function cp(t){var p=prod($('#c-p').value);if(!p)return;if(!t)$('#c-b').value=p.buy;$('#c-tot').textContent='Total owed to farmer: '+gh(num('#c-q')*num('#c-b'))}
function sp(t){var p=prod($('#s-p').value);if(!p)return;var pr=$('#s-pr');if(!t){pr.dataset.t='';pr.value=p.sell}var tot=num('#s-q')*num('#s-pr'),m=$('#s-m').value;$('#s-pt').hidden=m!='p';$('#s-du').hidden=m=='f';$('#s-tot').textContent='Total: '+gh(tot)}
function addCol(){var p=prod($('#c-p').value),q=num('#c-q');if(!p||q<=0)return toast('Enter the number of crates');var t=num('#c-t'),d=$('#c-d').value||td();S.col.push({id:uid(),date:d,pid:p.id,lbl:p.farm+' · '+p.item,qty:q,buy:num('#c-b'),shop:$('#c-s').value,paid:$('#c-pd').checked});if(t>0)S.costs.push({id:uid(),date:d,descr:'Transport: '+p.farm,amt:t});save();toast('Collection saved');render()}
function addSale(){var p=prod($('#s-p').value),q=num('#s-q'),pr=num('#s-pr');if(!p||q<=0||pr<=0)return toast('Enter crates and price');var m=$('#s-m').value,cust=$('#s-c').value.trim(),tot=q*pr,paid=m=='f'?tot:m=='c'?0:Math.min(num('#s-a'),tot);if(m!='f'&&paid<tot&&!cust)return toast('Enter the customer name for credit');var d=$('#s-d').value||td();S.sales.push({id:uid(),date:d,pid:p.id,lbl:p.farm+' · '+p.item,qty:q,price:pr,shop:$('#s-s').value,cust:cust,paid:paid,due:paid<tot?plus(+$('#s-dd').value):''});save();toast('Sale saved');render()}
function pay(i){var d=debts()[i],a=num('#pa'+i);if(!d||a<=0)return toast('Enter the amount paid');S.pay.push({id:uid(),date:td(),cust:d.n,amt:a});save();toast('Payment recorded');render()}
function addCost(){var a=num('#x-a');if(a<=0)return toast('Enter an amount');S.costs.push({id:uid(),date:$('#x-d').value||td(),descr:$('#x-n').value.trim()||'Transport',amt:a});save();toast('Expense saved');render()}
function addPrice(){var f=$('#n-f').value.trim(),i=$('#n-i').value.trim();if(!f||!i)return toast('Enter farm and egg size');S.prices.push({id:uid(),farm:f,item:i,buy:num('#n-b'),sell:num('#n-s'),hist:[]});save();toast('Price added');render()}
function upP(id,f,v){var p=prod(id);p.hist.push({date:td(),buy:p.buy,sell:p.sell});p[f]=parseFloat(v)||0;save();render()}
function delP(id){if(!confirm('Delete this price? Past records are kept.'))return;S.prices=S.prices.filter(function(p){return p.id!=id});save();render()}
var TABS=[['home','⌂','Home'],['collect','↓','Collect'],['sell','$','Sell'],['credit','◔','Credit'],['costs','⛟','Costs'],['prices','≡','Prices']];
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){$('#nv').innerHTML=TABS.map(function(t){return'<button class="'+(t[0]==tab?'a':'')+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join('');$('#m').innerHTML=V[tab]();$('#wk').textContent='Week of '+wkStart();if(tab=='collect')cp();if(tab=='sell')sp()}
function backup(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='afa-backup-'+td()+'.json';a.click()}
function loginView(){$('#nv').innerHTML='';$('#m').innerHTML='<div class="c"><h2>Sign in</h2><label>Email<input id="l-e" type="email" autocomplete="username"></label><label>Password<input id="l-p" type="password" autocomplete="current-password"></label><button onclick="login()">Sign in</button></div>'}
async function login(){var r=await SB.auth.signInWithPassword({email:$('#l-e').value.trim(),password:$('#l-p').value});if(r.error)return toast('Wrong email or password');await load();render()}
async function logout(){await SB.auth.signOut();loginView()}
async function boot(){if(SB_URL.indexOf('PASTE')==0){$('#m').innerHTML='<div class="c">Setup needed: paste your Supabase URL and anon key at the top of the script in index.html.</div>';return}SB=supabase.createClient(SB_URL,SB_KEY);var s=await SB.auth.getSession();if(s.data.session){await load();render()}else loginView()}
boot();
</script></body></html>
