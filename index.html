<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F5E3B">
  <title>AFA Fresh Eggs Manager</title>
  <meta name="description" content="Daily egg sales, farm collections, customer credit and stock manager.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Header & Status Indicator -->
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="38" height="38" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" fill="#FFF6E0"/>
        <circle cx="50" cy="50" r="42" fill="#1F5E3B"/>
        <path d="M50 22C64 22 72 38 72 50C72 63 62 71 50 71C38 71 28 63 28 50C28 38 36 22 50 22Z" fill="#FFF6E0"/>
        <circle cx="50" cy="55" r="9" fill="#F5A623"/>
        <path d="M50 72C42 74 34 71 31 65C39 64 47 66 50 72ZM50 72C58 74 66 71 69 65C61 64 53 66 50 72Z" fill="#7FC77A"/>
      </svg>
      <div>
        <b>AFA FRESH EGGS</b>
        <small id="wk"></small>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="sync-pill" class="sync-pill" hidden title="Connection status">Synced</span>
      <button type="button" onclick="toggleTheme()" class="icon-btn" aria-label="Toggle theme">🌓</button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="m"></main>

  <!-- Bottom Navigation Menu -->
  <nav id="nv"></nav>

  <!-- Floating Feedback Toast -->
  <div id="toast" hidden></div>

  <!-- Supabase CDN Client Script (v2 for sb_publishable_ + anon key support) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Application Logic -->
  <script src="app.js"></script>
  <!-- Offline PWA Service Worker Registration (#6) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
