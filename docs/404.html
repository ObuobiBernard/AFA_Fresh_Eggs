<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found (404) · AFA Fresh Eggs</title>
  <meta name="description" content="The requested page could not be found. Return to AFA Fresh Eggs Manager dashboard.">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <style>
    :root {
      --g: #1F5E3B;
      --bg: #F7F5EE;
      --cd: #FFFFFF;
      --tx: #142219;
      --mu: #6B7280;
      --bd: #E5E7EB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --g: #2d8252;
        --bg: #0F1713;
        --cd: #19241E;
        --tx: #F3F4F6;
        --mu: #9CA3AF;
        --bd: #2E3E34;
      }
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: var(--cd);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.06);
    }
    .badge {
      width: 72px;
      height: 72px;
      background: rgba(31, 94, 59, 0.1);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
    }
    p {
      margin: 0 0 24px;
      color: var(--mu);
      font-size: 14px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--g);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🥚</div>
    <h1>404 · Page Not Found</h1>
    <p>The link or screen you requested does not exist or may have been relocated.</p>
    <a href="./" class="btn">Return to AFA Eggs Dashboard ➔</a>
  </div>
</body>
</html>
