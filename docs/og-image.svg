<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1F5E3B"/>

  <!-- Decorative subtle grid circles -->
  <circle cx="1100" cy="100" r="280" fill="#2E7D4E" opacity="0.15"/>
  <circle cx="100" cy="530" r="220" fill="#D97706" opacity="0.08"/>

  <!-- Brand Emblem Container -->
  <g transform="translate(140, 165)">
    <!-- Egg Icon Badge -->
    <rect width="130" height="130" rx="36" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
    <ellipse cx="65" cy="70" rx="36" ry="46" fill="#FAF5EB" filter="url(#cardShadow)"/>
    <ellipse cx="55" cy="55" rx="8" ry="14" fill="#FFFFFF" opacity="0.7" transform="rotate(-20 55 55)"/>

    <!-- Brand Typography -->
    <text x="160" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      AFA Fresh Eggs
    </text>
    <text x="160" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#D97706" letter-spacing="2">
      ENTERPRISE · GHANA
    </text>
  </g>

  <!-- Tagline & Description Banner -->
  <g transform="translate(140, 350)">
    <rect width="920" height="180" rx="24" fill="rgba(0, 0, 0, 0.28)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">
      Daily Egg Sales, Farm Collections &amp; Customer Credit
    </text>

    <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#E5E7EB">
      Wholesale Farm Egg Distribution Hubs · Adenta &amp; Madina Market, Greater Accra
    </text>

    <!-- Badges -->
    <g transform="translate(40, 125)">
      <!-- Badge 1 -->
      <rect width="180" height="32" rx="16" fill="rgba(31, 94, 59, 0.8)" stroke="#3ba369" stroke-width="1"/>
      <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
        🌾 From Farm Weekly
      </text>

      <!-- Badge 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="32" rx="16" fill="rgba(217, 119, 6, 0.3)" stroke="#F59E0B" stroke-width="1"/>
        <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FCD34D" text-anchor="middle">
          📦 Crated Distribution
        </text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(390, 0)">
        <rect width="200" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
        <text x="100" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
          ⚡ Real-time Statements
        </text>
      </g>
    </g>
  </g>
</svg>
